name: JITPOMI compatibility validation
on:
  push:
    branches: ["jitpomi/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p postcard --features use-std,experimental-derive && cargo test -p postcard --no-default-features
